name: ech_http
description: An HTTP client with explicit TLS Encrypted Client Hello, proxy support, and a C++ backend bundled through Dart build hooks.
version: 0.1.2
repository: https://github.com/ech-research/ech_http
issue_tracker: https://github.com/ech-research/ech_http/issues
# Deliberately public test-only key; never used by the runtime library.
false_secrets:
  - /test/fixtures/localhost-key.pem
environment:
  sdk: '>=3.10.0 <4.0.0'
platforms:
  android:
  ios:
  linux:
  macos:
  windows:
topics:
  - http
  - tls
  - ech
  - ffi
  - networking
dependencies:
  archive: ^4.0.9
  code_assets: ^2.1.0
  crypto: ^3.0.6
  ffi: ^2.1.4
  hooks: ^2.2.0
  http: ^1.6.0
  path: ^1.9.1
dev_dependencies:
  lints: ^6.0.0
  test: ^1.29.0
